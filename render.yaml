services:
  - type: web
    name: retail-pos-api
    runtime: node
    buildCommand: npm install --include=dev && npx prisma db push --skip-generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 8h
